# Sobe o Matheus Marx Tools em http://localhost:7767
#
#   docker compose up -d
#
# Não há volume nem banco: o contêiner é descartável e nenhum dado de quem usa
# passa por ele — os arquivos são processados dentro do navegador.

services:
  tools:
    build:
      context: .
      args:
        # A imagem roda sem nenhuma dependência externa. As duas ferramentas de
        # Áudio & Voz ficam de fora: elas precisam das funções em api/, que
        # rodam na Vercel, e aparecem desligadas com um aviso.
        #
        # Trava de domínio, desligada por padrão. Em auto-hospedagem geralmente
        # se deixa vazia mesmo.
        VITE_ALLOWED_HOSTS: "${VITE_ALLOWED_HOSTS:-}"
    image: matheusmarx-tools:local
    container_name: matheusmarx-tools
    ports:
      - "7767:7767"
    restart: unless-stopped
    # O contêiner só lê arquivos já embutidos na imagem; nada precisa ser escrito
    # em disco durante o uso.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
