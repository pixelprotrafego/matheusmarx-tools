# Identificador do projeto, visível na URL do painel:
# https://supabase.com/dashboard/project/<ref>
# `supabase link --project-ref <ref>` reescreve este campo.
project_id = "iggipiyrwikavzpcnziw"

# Estas duas são chamadas sem sessão de usuário e validam o acesso por conta
# própria: transcribe-audio confere a origem e o limite por IP, e
# telegram-webhook confere o secret enviado pelo Telegram no cabeçalho.
[functions.transcribe-audio]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false
