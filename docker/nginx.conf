# Servidor da imagem Docker.
#
# O aplicativo é inteiramente estático: não há backend, banco nem processo de
# servidor. Este arquivo existe para três coisas que um servidor de arquivos
# genérico erraria — o tipo MIME do WebAssembly, o desvio de rotas do SPA e os
# cabeçalhos de segurança.

server {
    # Acima de 1024, então o nginx não precisa de privilégio para abrir a porta.
    #
    # Só IPv4 de propósito. Um `listen [::]:7767` derruba o nginx com
    # "Address family not supported by protocol" em qualquer host cujo Docker
    # esteja sem IPv6, que ainda é o padrão em muita instalação. O mapeamento de
    # porta do Docker fala IPv4 com o contêiner, então nada se perde.
    listen 7767;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sem bloco `types` e sem `include mime.types` aqui.
    #
    # O nginx.conf padrão da imagem já faz `include /etc/nginx/mime.types` no
    # nível http, e desde a versão 1.21.1 esse arquivo mapeia .wasm para
    # application/wasm — que é o tipo de que o ffmpeg e o removedor de fundo
    # precisam para carregar.
    #
    # Repetir o include aqui era um erro de sintaxe, não um exagero: o
    # mime.types já vem embrulhado num `types { }`, então incluí-lo ao lado de
    # outro bloco `types` dá dois blocos no mesmo contexto, e o nginx recusa
    # subir com "types directive is duplicate". A garantia explícita do tipo
    # ficou no `location` de .wasm, mais abaixo.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    # ---------------------------------------------------------------- segurança
    #
    # Esta CSP não libera NENHUMA origem externa. Não é um detalhe de
    # configuração: é a promessa do projeto transformada em regra que o
    # navegador aplica. Fontes, motor de vídeo e modelos vêm todos do próprio
    # contêiner, então qualquer tentativa de buscar algo lá fora — por um
    # descuido futuro ou por uma dependência nova — falha de forma visível em
    # vez de virar uma requisição silenciosa.
    #
    # Ligou Supabase para as ferramentas de áudio? Acrescente
    # https://SEU-PROJETO.supabase.co ao connect-src abaixo, e só ele.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ------------------------------------------------------------------- cache
    #
    # Aqui só `expires`, sem `add_header Cache-Control`, e isso é intencional.
    # No nginx, um `location` que declara qualquer `add_header` próprio **perde
    # todos os add_header herdados do bloco de cima** — estas três pastas
    # ficariam sem a CSP e sem o nosniff. O `expires` sozinho já emite o
    # Cache-Control, e a herança dos cabeçalhos de segurança fica intacta.
    #
    # Os arquivos com hash no nome, o motor de vídeo e as fontes podem ser
    # guardados para sempre; o index.html nunca, senão o navegador continua
    # abrindo a versão antiga depois de atualizar a imagem.
    location /assets/ {
        expires 1y;
    }

    location /ffmpeg/ {
        expires 1y;
    }

    location /fonts/ {
        expires 1y;
    }

    # Garantia explícita do tipo do WebAssembly, para o caso de uma imagem base
    # com mime.types antigo. O `types { }` vazio zera a tabela só aqui dentro e
    # deixa o default_type valer — é o idioma documentado do nginx para forçar
    # um tipo, e não conflita com o include do nível http.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # Rotas do React Router não existem como arquivo: tudo o que não for um
    # arquivo real cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
