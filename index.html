<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Matheus Marx Tools — Conversão de PDF, vídeo e mídia no navegador</title>
    <meta name="description" content="Ferramentas gratuitas no navegador para converter PDF, DOCX, XLSX, imagens, vídeo e áudio. Tudo processado localmente, sem upload.">
    <meta name="author" content="Matheus Marx" />

    <!-- As tags abaixo apontam para a instalação oficial. Um fork que vá ao ar
         num domínio próprio deve trocar as URLs de og:url, og:image, twitter:image
         e canonical — veja a seção "Self-hosting" do README. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Matheus Marx Tools" />
    <meta property="og:url" content="https://tools.matheusmarx.com.br/" />
    <meta property="og:title" content="Matheus Marx Tools — Conversão de PDF, vídeo e mídia no navegador">
    <meta property="og:description" content="Ferramentas gratuitas no navegador para converter PDF, DOCX, XLSX, imagens, vídeo e áudio. Tudo processado localmente, sem upload.">
    <meta property="og:image" content="https://tools.matheusmarx.com.br/og-image.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Matheus Marx Tools — Conversão de PDF, vídeo e mídia no navegador">
    <meta name="twitter:description" content="Ferramentas gratuitas no navegador para converter PDF, DOCX, XLSX, imagens, vídeo e áudio. Tudo processado localmente, sem upload.">
    <meta name="twitter:image" content="https://tools.matheusmarx.com.br/og-image.png">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="canonical" href="https://tools.matheusmarx.com.br/" />

    <!-- Fontes da marca, servidas pelo próprio domínio a partir de public/fonts/.
         As declarações @font-face estão em src/index.css; aqui só se adianta o
         download dos dois arquivos que toda página usa, porque o navegador só
         descobriria a existência deles depois de baixar e interpretar o CSS. -->
    <link rel="preload" href="/fonts/sora-v17-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/dm-sans-v17-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- A Content-Security-Policy NÃO mora mais aqui.
         Ela é enviada como cabeçalho HTTP pelo servidor, porque só assim dá para
         ter uma política diferente por instalação: a hospedagem oficial libera o
         rastreador do Meta, e a imagem Docker de quem roda em casa não libera
         nada além do próprio domínio. Duas CSPs simultâneas (meta + cabeçalho)
         se somariam pela interseção e quebrariam uma das duas instalações.
         Veja `vercel.json` e `docker/nginx.conf`. -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Matheus Marx Tools",
        "url": "https://tools.matheusmarx.com.br/",
        "description": "Ferramentas gratuitas no navegador para converter PDF, DOCX, XLSX, imagens, vídeo e áudio. Processamento 100% local."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Matheus Marx",
        "url": "https://tools.matheusmarx.com.br/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
